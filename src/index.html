<section class="scr" id="boot"><img class="brand" src="icon.png" alt="" width="96" height="96"><div class="logo" style="font-size:2.2em">ASC DESK</div><p id="bm">Carregando…</p>
 <div class="row" id="br" hidden><button class="btn p" id="b1">Tentar de novo</button><button class="btn" id="b2">Apagar dados locais</button></div></section>

<section class="scr" id="add" hidden>
 <img class="brand" src="icon.png" alt="" width="72" height="72" style="width:4.5em;height:4.5em"><div class="logo" style="font-size:2em">ASC DESK</div>
 <h1 style="font-size:1.6em">Como você quer entrar?</h1>
 <div class="row"><button class="btn p" id="m1">Servidor e login</button><button class="btn" id="m2">Lista M3U</button></div>
 <input id="ln" placeholder="Nome da lista (opcional)" maxlength="40" autocomplete="off">
 <div class="fm" id="xt">
  <input id="xs" placeholder="Servidor (ex.: http://servidor.com:8080)" inputmode="url" autocapitalize="none" autocomplete="off">
  <input id="xu" placeholder="Login" autocapitalize="none" autocomplete="off">
  <input id="xp" type="password" placeholder="Senha" autocapitalize="none" autocomplete="off">
  <button class="btn p" id="xg">Entrar</button>
 </div>
 <div class="fm" id="ml" hidden>
  <input id="u" placeholder="Link da lista (http://...)" inputmode="url">
  <input id="e" placeholder="Link do EPG/XMLTV (opcional)" inputmode="url">
  <div class="row"><button class="btn p" id="go">Carregar lista</button>
  <label class="btn" tabindex="0" id="fl">Abrir arquivo<input type="file" id="f" accept=".m3u,.m3u8,.txt" hidden></label>
  <button class="btn" id="pa">Colar texto</button></div>
  <textarea id="ta" rows="5" placeholder="Cole aqui o conteúdo da lista" hidden></textarea>
 </div>
 <p id="st"></p>
 <button class="btn" id="ac" hidden>Voltar</button>
</section>

<section class="scr" id="lock" hidden>
 <div class="logo" style="font-size:2.2em">ASC DESK</div>
 <h1 id="lt" style="font-size:1.3em"></h1><div id="ld"></div><p id="lm"></p>
 <div id="kp"><button class="btn" data-k="1">1</button><button class="btn" data-k="2">2</button><button class="btn" data-k="3">3</button><button class="btn" data-k="4">4</button><button class="btn" data-k="5">5</button><button class="btn" data-k="6">6</button><button class="btn" data-k="7">7</button><button class="btn" data-k="8">8</button><button class="btn" data-k="9">9</button><button class="btn" data-k="x">⌫</button><button class="btn" data-k="0">0</button><button class="btn p" data-k="ok">OK</button></div>
 <div class="row"><button class="btn" id="lc" hidden>Cancelar</button></div>
</section>
<div id="cover" hidden></div>
<section class="scr" id="blk" hidden><div class="logo" style="font-size:2.2em">ASC DESK</div><h1 style="font-size:1.4em" id="bt">Ambiente inseguro</h1><p id="bp">Por segurança, o app não abre com um depurador conectado. Desconecte-o e abra o app de novo.</p></section>

<div id="app" hidden>
 <nav>
  <div class="nb"><img class="brand s" src="icon.png" alt="" width="36" height="36"><span class="logo">ASC DESK</span></div>
  <button data-t="home"><svg class="i"><use href="#ihome"/></svg><span>Início</span></button>
  <button data-t="tv"><svg class="i"><use href="#tv"/></svg><span>Canais</span></button>
  <button data-t="movie"><svg class="i"><use href="#film"/></svg><span>Filmes</span></button>
  <button data-t="series"><svg class="i"><use href="#series"/></svg><span>Séries</span></button>
  <button data-t="fav"><svg class="i"><use href="#star"/></svg><span>Favoritos</span></button>
  <i class="sp"></i>
  <button id="cfg"><svg class="i"><use href="#gear"/></svg><span>Ajustes</span></button>
 </nav>
 <header><input id="q" type="search" placeholder="Buscar canais, filmes e séries…  ( / )" aria-label="Buscar" autocomplete="off"></header>
 <div id="exp" hidden><span id="et"></span><button class="chip" id="ex" aria-label="Fechar">✕</button></div>
 <button class="chip catb" id="catb" hidden><span id="cl">Todas as categorias</span><svg class="i" style="width:1.1em;height:1.1em"><use href="#chev"/></svg></button>
 <main id="main"><div id="home" hidden></div><div id="grid"></div><div id="more" style="height:1px"></div></main>
</div>
<div id="tip" hidden></div>
<div id="sheet" hidden><div id="sh"></div></div>

<div id="player" hidden>
 <video id="v" playsinline poster="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"></video>
 <div id="sp"><svg viewBox="0 0 50 50"><defs><linearGradient id="sg"><stop offset="0" stop-color="#FE5101"/><stop offset="1" stop-color="#fff"/></linearGradient></defs><circle cx="25" cy="25" r="20" fill="none" stroke="url(#sg)" stroke-width="4" stroke-linecap="round" stroke-dasharray="80 60"/></svg></div>
 <div class="ov" id="ot"><button class="gb" id="bk" aria-label="Voltar" title="Voltar (Esc)"><svg class="i"><use href="#back"/></svg></button><div style="flex:1;min-width:0"><b id="pt"></b><div id="pe"></div></div><button class="gb" id="pf" aria-label="Favoritar" title="Favoritar"><svg class="i"><use href="#star"/></svg></button></div>
 <div class="ov" id="ob">
  <div id="lv" hidden><span class="dot"></span>AO VIVO</div><div id="epg" hidden></div>
  <div id="sk"><div id="tr"><i id="bf"></i><i id="pr"></i></div><b id="th"></b></div>
  <div id="ct">
   <button class="gb" id="pv" aria-label="Anterior" title="Anterior / -10 s"><svg class="i"><use href="#rw10"/></svg></button>
   <button class="gb big" id="pp" aria-label="Pausar ou continuar" title="Pausar / continuar (Espaço)"><svg class="i"><use href="#pause"/></svg></button>
   <button class="gb" id="nx" aria-label="Próximo" title="Próximo / +10 s"><svg class="i"><use href="#fw10"/></svg></button>
   <div id="tm"><span id="t1">0:00</span><span>/</span><span id="t2">0:00</span></div>
   <i class="sp"></i>
   <button class="gb" id="mu" aria-label="Mudo" title="Mudo (M)"><svg class="i"><use href="#ivol"/></svg></button>
   <input id="vol" type="range" min="0" max="1" step="0.01" value="1" aria-label="Volume">
    <button class="chip" id="quality" aria-label="Qualidade: automática" title="Selecionar qualidade" hidden>Auto</button>
   <button class="gb" id="fit" aria-label="Ajustar imagem" title="Preencher / ajustar"><svg class="i"><use href="#iscreen"/></svg></button>
   <button class="gb" id="pip" aria-label="Imagem sobre imagem" title="Janela flutuante (P)"><svg class="i"><use href="#ipip"/></svg></button>
   <button class="gb" id="fs" aria-label="Tela cheia" title="Tela cheia (F)"><svg class="i"><use href="#ifs"/></svg></button>
  </div>
 </div>
</div>
